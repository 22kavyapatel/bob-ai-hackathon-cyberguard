submission:
  title: "ThreatSense AI"               # REQUIRED — Project display name

  problem_statement: >                   # REQUIRED — 1-3 sentences. What problem? Who has it?
    Security Operations Centre (SOC) analysts are overwhelmed by hundreds of
    raw cybersecurity alerts per shift. Without intelligent triage, critical
    threats are buried in noise, leading to slow response times, analyst
    fatigue, and missed incidents that can result in costly data breaches.

  solution_summary: >                    # REQUIRED — 1-3 sentences. What did you build?
    ThreatSense AI is an AI-powered threat intelligence correlation and alert
    prioritisation assistant that ingests raw security alerts, correlates
    related events, calculates a risk score, maps techniques to MITRE ATT&CK,
    and generates a BLUF (Bottom Line Up Front) threat summary with recommended
    analyst actions — powered by IBM watsonx.ai and IBM Bob.

  key_features:                          # REQUIRED — List 3 to 5 specific features
    - "AI-driven alert correlation: groups related alerts by source IP, attack pattern and time window to surface campaign-level threats"
    - "Risk scoring engine: calculates a 0-100 threat score per alert group using severity, frequency, asset criticality and MITRE ATT&CK coverage"
    - "MITRE ATT&CK mapping: automatically tags detected techniques (e.g. T1059, T1190) on each correlated alert cluster"
    - "BLUF threat summary: IBM watsonx.ai Granite model generates a one-paragraph analyst-ready summary and prioritised recommended actions"
    - "Interactive SOC dashboard: real-time severity filtering, status tracking (Open/In Review/Closed), and drill-down alert detail panel"

  tech_stack:
    languages: ["Python", "TypeScript", "JavaScript"]
    frameworks: ["FastAPI", "React", "Tailwind CSS", "Vite"]
    ibm_technologies: ["IBM watsonx.ai (Granite-3-8B-Instruct)", "IBM Bob AI Assistant"]
    databases: []
    other: ["Uvicorn", "CORS middleware", "Simulated SIEM alert data"]

  what_we_are_most_proud_of: >           # Optional but recommended
    The end-to-end AI pipeline: raw noisy alerts enter, and within seconds
    the analyst sees correlated attack clusters, MITRE ATT&CK technique tags,
    a risk score, a human-readable BLUF summary, and concrete recommended
    actions — all running locally with no external dependencies beyond
    watsonx.ai. IBM Bob was used throughout the development workflow to
    accelerate code generation, architecture decisions, and documentation.

  known_limitations: >                   # Optional but recommended
    Alert data is simulated (not ingested from a live SIEM). The watsonx.ai
    BLUF summary requires a valid API key; without one the app falls back to
    a rule-based summary. Correlation logic uses a heuristic time-window and
    IP-overlap approach rather than a trained ML model. The app is not
    hardened for production deployment.

